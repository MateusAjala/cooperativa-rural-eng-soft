services:
  db:
    image: postgres:16-alpine
    container_name: cooperativa_db
    environment:
      POSTGRES_DB: cooperativa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./banco/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cooperativa"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: